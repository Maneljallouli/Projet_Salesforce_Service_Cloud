name: Deploy to Sandbox UAT

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Display Salesforce CLI Version
        run: |
          sf --version
          sf plugins --core

      - name: Setup Deployment Configuration
        run: |
          sf config set org-metadata-rest-deploy=false --global

      - name: Auth org cible via JWT
        run: |
          echo "${{ secrets.SF_TARGET_PRIVATE_KEY }}" > /tmp/server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_TARGET_CLIENT_ID }} \
            --jwt-key-file /tmp/server.key \
            --username ${{ secrets.SF_TARGET_USERNAME }} \
            --instance-url https://test.salesforce.com \
            --alias org-cible
          rm /tmp/server.key

          sf org display --target-org org-cible

      # -------------------------------------------------------------
      # HELPER DE DEPLOIEMENT
      # Accepte des dossiers et des fichiers précis.
      # Bloque volontairement les dashboards.
      # -------------------------------------------------------------
      - name: Create Deployment Helper
        run: |
          cat > deploy_existing_paths.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          WAIT_TIME="$1"
          shift

          SOURCE_ARGS=()

          for path in "$@"; do
            case "$path" in
              dashboards|*/dashboards|*/dashboards/*|analyticsDashboards|*/analyticsDashboards|*/analyticsDashboards/*)
                echo "::warning::Déploiement bloqué volontairement pour: $path"
                continue
                ;;
            esac

            if [ -e "$path" ]; then
              echo "Ajout au déploiement: $path"
              SOURCE_ARGS+=(--source-dir "$path")
            else
              echo "::notice::Chemin absent, ignoré: $path"
            fi
          done

          if [ ${#SOURCE_ARGS[@]} -eq 0 ]; then
            echo "Aucun fichier/dossier existant à déployer pour cette étape."
            exit 0
          fi

          sf project deploy start \
            "${SOURCE_ARGS[@]}" \
            --target-org org-cible \
            --api-version 66.0 \
            --test-level NoTestRun \
            --concise \
            --wait "$WAIT_TIME"
          BASH

          chmod +x deploy_existing_paths.sh

      # -------------------------------------------------------------
      # 1. METADONNEES DE BASE
      # -------------------------------------------------------------
      - name: 1 - Deploy Core Metadata
        run: |
          ./deploy_existing_paths.sh 30 \
            force-app/main/default/standardValueSets \
            force-app/main/default/globalValueSets \
            force-app/main/default/objects \
            force-app/main/default/customMetadata \
            force-app/main/default/customPermissions \
            force-app/main/default/queues \
            force-app/main/default/groups \
            force-app/main/default/duplicateRules

      # -------------------------------------------------------------
      # 2. INTEGRATIONS UNIQUEMENT
      # Pas de déploiement complet Apex/classes/triggers ici.
      # Les Apex nécessaires aux LWC sont déployés dans l'étape 5A.
      # -------------------------------------------------------------
      - name: 2 - Deploy Integration Metadata Only
        run: |
          ./deploy_existing_paths.sh 20 \
            force-app/main/default/namedCredentials \
            force-app/main/default/externalCredentials \
            force-app/main/default/certificates \
            force-app/main/default/authproviders \
            force-app/main/default/remoteSiteSettings \
            force-app/main/default/externalServices

      # -------------------------------------------------------------
      # 3. VALIDATION DES FICHIERS CRITIQUES SERVICE_CLIENT_AI
      # -------------------------------------------------------------
      - name: 3 - Validate Service_Client_AI Critical Files
        run: |
          set -euo pipefail

          test -d force-app/main/default/bots/Service_Client_AI
          test -f force-app/main/default/bots/Service_Client_AI/Service_Client_AI.bot-meta.xml
          test -f force-app/main/default/bots/Service_Client_AI/v1.botVersion-meta.xml

          test -d force-app/main/default/genAiPlannerBundles/Service_Client_AI
          test -f force-app/main/default/genAiPlannerBundles/Service_Client_AI/Service_Client_AI.genAiPlannerBundle

          test -f force-app/main/default/flows/Autolaunched_Flow_Get_Email_Templates.flow-meta.xml
          test -f force-app/main/default/flows/Generate_Email_Draft_Action.flow-meta.xml
          test -f force-app/main/default/flows/AutoLaunchedFlowMergeAndSaveDraft.flow-meta.xml

          test -f force-app/main/default/genAiPromptTemplates/Choix_Du_Template.genAiPromptTemplate-meta.xml

          echo "Tous les fichiers critiques Service_Client_AI sont présents."

      # -------------------------------------------------------------
      # 4A. PROMPT BUILDER - TEMPLATES
      # Les prompts doivent être déployés avant les flows.
      # -------------------------------------------------------------
      - name: 4A - Deploy Prompt Builder Templates
        run: |
          ./deploy_existing_paths.sh 30 \
            force-app/main/default/genAiPromptTemplates/Auto_choix_emailTemplate.genAiPromptTemplate-meta.xml \
            force-app/main/default/genAiPromptTemplates/Case_Summary.genAiPromptTemplate-meta.xml \
            force-app/main/default/genAiPromptTemplates/Choix_Du_Template.genAiPromptTemplate-meta.xml \
            force-app/main/default/genAiPromptTemplates/Email_Case_Analyzer.genAiPromptTemplate-meta.xml

      # -------------------------------------------------------------
      # 4B. PROMPT BUILDER - ACTIVATIONS
      # Le helper ignore les fichiers absents.
      # -------------------------------------------------------------
      - name: 4B - Deploy Prompt Builder Activations
        run: |
          ./deploy_existing_paths.sh 30 \
            force-app/main/default/genAiPromptTemplateActivations/Auto_choix_emailTemplate.genAiPromptTemplateActivation-meta.xml \
            force-app/main/default/genAiPromptTemplateActivations/Case_Summary.genAiPromptTemplateActivation-meta.xml \
            force-app/main/default/genAiPromptTemplateActivations/Choix_Du_Template.genAiPromptTemplateActivation-meta.xml \
            force-app/main/default/genAiPromptTemplateActivations/Email_Case_Analyzer.genAiPromptTemplateActivation-meta.xml

      # -------------------------------------------------------------
      # 4C. PAUSE
      # Laisse Salesforce exposer les prompts comme actions Flow.
      # -------------------------------------------------------------
      - name: 4C - Wait for Prompt Builder Actions
        run: sleep 30

      # -------------------------------------------------------------
      # 4D. FLOWS UTILISES PAR SERVICE_CLIENT_AI
      # -------------------------------------------------------------
      - name: 4D - Deploy Service_Client_AI Flows
        run: |
          ./deploy_existing_paths.sh 45 \
            force-app/main/default/flows/Autolaunched_Flow_Get_Email_Templates.flow-meta.xml \
            force-app/main/default/flows/AutoLaunchedFlowMergeAndSaveDraft.flow-meta.xml \
            force-app/main/default/flows/Generate_Email_Draft_Action.flow-meta.xml

      # -------------------------------------------------------------
      # 4E. AGENTFORCE SERVICE_CLIENT_AI
      # Planner Bundle + Bot + BotVersion.
      # -------------------------------------------------------------
      - name: 4E - Deploy Agentforce Service_Client_AI
        run: |
          ./deploy_existing_paths.sh 60 \
            force-app/main/default/genAiPlannerBundles/Service_Client_AI \
            force-app/main/default/bots/Service_Client_AI

      # -------------------------------------------------------------
      # 5A. DETECTER ET DEPLOYER LES APEX UTILISES PAR LWC/AURA
      #
      # Correction pour l'erreur:
      # caseChatFeed -> CaseCommentController.postSupportMessage
      #
      # Cette étape lit les imports LWC:
      # @salesforce/apex/ClassName.methodName
      #
      # Puis déploie seulement les Apex classes correspondantes.
      # -------------------------------------------------------------
      - name: 5A - Deploy Apex Dependencies Used By LWC and Aura
        run: |
          set -euo pipefail

          IMPORTS_FILE="$(mktemp)"
          CLASSES_FILE="$(mktemp)"

          echo "Recherche des imports Apex dans les LWC..."

          if [ -d "force-app/main/default/lwc" ]; then
            grep -RhoE "@salesforce/apex/[A-Za-z0-9_]+\.[A-Za-z0-9_]+" force-app/main/default/lwc \
              | sed -E 's#.*@salesforce/apex/([A-Za-z0-9_]+)\.([A-Za-z0-9_]+).*#\1.\2#' \
              | sort -u > "$IMPORTS_FILE" || true
          fi

          echo "Recherche des Apex controllers dans Aura..."

          if [ -d "force-app/main/default/aura" ]; then
            grep -RhoE 'controller="[A-Za-z0-9_]+"' force-app/main/default/aura \
              | sed -E 's#controller="([A-Za-z0-9_]+)"#\1#' \
              | sort -u >> "$CLASSES_FILE" || true
          fi

          if [ -s "$IMPORTS_FILE" ]; then
            echo "Imports Apex LWC détectés:"
            cat "$IMPORTS_FILE"

            cut -d "." -f 1 "$IMPORTS_FILE" >> "$CLASSES_FILE"
          else
            echo "Aucun import Apex LWC détecté."
          fi

          if [ ! -s "$CLASSES_FILE" ]; then
            echo "Aucune Apex class à déployer pour LWC/Aura."
            exit 0
          fi

          sort -u "$CLASSES_FILE" -o "$CLASSES_FILE"

          echo "Apex classes candidates:"
          cat "$CLASSES_FILE"

          # Validation: si un LWC importe Class.method et que la classe existe localement,
          # on vérifie que la méthode existe dans le fichier Apex.
          MISSING_METHOD=0

          if [ -s "$IMPORTS_FILE" ]; then
            while IFS= read -r importRef; do
              CLASS_NAME="${importRef%%.*}"
              METHOD_NAME="${importRef##*.}"

              CLASS_FILE="$(find force-app/main/default/classes -name "${CLASS_NAME}.cls" | head -n 1 || true)"

              if [ -z "$CLASS_FILE" ]; then
                echo "::warning::Classe Apex non trouvée localement pour import LWC: ${CLASS_NAME}.${METHOD_NAME}. Elle doit déjà exister dans l'org cible sinon le LWC échouera."
                continue
              fi

              if ! grep -qE "[[:space:]]${METHOD_NAME}[[:space:]]*\(" "$CLASS_FILE"; then
                echo "::error::Le LWC référence ${CLASS_NAME}.${METHOD_NAME}, mais la méthode n'existe pas dans $CLASS_FILE"
                MISSING_METHOD=1
              fi
            done < "$IMPORTS_FILE"
          fi

          if [ "$MISSING_METHOD" -eq 1 ]; then
            echo "Corrige les imports LWC ou ajoute les méthodes Apex manquantes avant de déployer les LWC."
            exit 1
          fi

          METADATA_ARGS=()

          while IFS= read -r CLASS_NAME; do
            CLASS_FILE="$(find force-app/main/default/classes -name "${CLASS_NAME}.cls" | head -n 1 || true)"

            if [ -n "$CLASS_FILE" ]; then
              echo "Ajout ApexClass au déploiement: $CLASS_NAME ($CLASS_FILE)"
              METADATA_ARGS+=(--metadata "ApexClass:${CLASS_NAME}")
            else
              echo "::warning::ApexClass $CLASS_NAME non trouvée localement, ignorée."
            fi
          done < "$CLASSES_FILE"

          if [ ${#METADATA_ARGS[@]} -eq 0 ]; then
            echo "Aucune Apex class locale trouvée à déployer."
            exit 0
          fi

          sf project deploy start \
            "${METADATA_ARGS[@]}" \
            --target-org org-cible \
            --api-version 66.0 \
            --test-level NoTestRun \
            --concise \
            --wait 30

      # -------------------------------------------------------------
      # 5B. DEPLOY UI COMPONENTS
      # LWC/Aura/Flexipages/etc. sont déployés APRES les Apex utilisés.
      # Dashboards exclus.
      # -------------------------------------------------------------
      - name: 5B - Deploy UI Components and Experience Cloud
        run: |
          ./deploy_existing_paths.sh 30 \
            force-app/main/default/lwc \
            force-app/main/default/aura \
            force-app/main/default/flexipages \
            force-app/main/default/quickActions \
            force-app/main/default/layouts \
            force-app/main/default/tabs \
            force-app/main/default/applications \
            force-app/main/default/navigationMenus \
            force-app/main/default/staticresources \
            force-app/main/default/contentassets \
            force-app/main/default/experiences \
            force-app/main/default/digitalExperiences \
            force-app/main/default/networks \
            force-app/main/default/sites \
            force-app/main/default/siteDotComSites \
            force-app/main/default/brandingSets

      # -------------------------------------------------------------
      # 6. LABELS ET TRADUCTIONS
      # -------------------------------------------------------------
      - name: 6 - Deploy Labels and Translations
        run: |
          ./deploy_existing_paths.sh 20 \
            force-app/main/default/labels \
            force-app/main/default/translations \
            force-app/main/default/objectTranslations \
            force-app/main/default/globalValueSetTranslations

      # -------------------------------------------------------------
      # 7. REGLES DE GESTION ET DROITS
      # -------------------------------------------------------------
      - name: 7 - Deploy Rules and Permissions
        run: |
          ./deploy_existing_paths.sh 30 \
            force-app/main/default/assignmentRules \
            force-app/main/default/autoResponseRules \
            force-app/main/default/escalationRules \
            force-app/main/default/matchingRules \
            force-app/main/default/sharingRules \
            force-app/main/default/workflows \
            force-app/main/default/permissionsets \
            force-app/main/default/permissionsetgroups \
            force-app/main/default/mutingpermissionsets \
            force-app/main/default/profiles \
            force-app/main/default/roles

      # -------------------------------------------------------------
      # 8. RAPPORTS ET TEMPLATES
      # Dashboards exclus volontairement.
      # -------------------------------------------------------------
      - name: 8 - Deploy Reports and Templates Without Dashboards
        run: |
          ./deploy_existing_paths.sh 30 \
            force-app/main/default/email \
            force-app/main/default/pages \
            force-app/main/default/reports

      # -------------------------------------------------------------
      # 9. DEBUG
      # -------------------------------------------------------------
      - name: 9 - Display Full Error Report on Failure
        if: failure()
        run: |
          echo "Extraction du rapport de déploiement en cours..."
          sf project deploy report \
            --target-org org-cible \
            --use-most-recent \
            --json || true

      # -------------------------------------------------------------
      # 10. NOTIFICATIONS
      # -------------------------------------------------------------
      - name: Notify Success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify Failure
        if: failure()
        run: echo "Deployment failed!"