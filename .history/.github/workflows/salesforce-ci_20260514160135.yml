name: Deploy to Sandbox UAT (Production Ready)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # =========================
      # 0. SETUP CLI + AUTH
      # =========================
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Setup CLI config
        run: sf config set restDeploy=false --global

      - name: Authenticate org
        run: |
          echo "${{ secrets.SF_TARGET_PRIVATE_KEY }}" > /tmp/server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_TARGET_CLIENT_ID }} \
            --jwt-key-file /tmp/server.key \
            --username ${{ secrets.SF_TARGET_USERNAME }} \
            --instance-url https://test.salesforce.com \
            --alias org-cible
          rm /tmp/server.key

      # =========================================================
      # PHASE 1 — CORE FOUNDATION (SANS LOGIQUE MÉTIER)
      # =========================================================
      - name: PHASE 1 - Foundation
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/standardValueSets \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

          sf project deploy start \
            --source-dir force-app/main/default/queues \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

          sf project deploy start \
            --source-dir force-app/main/default/objects \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

          sf project deploy start \
            --source-dir force-app/main/default/permissionsets \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # Email Templates (CRITIQUE pour rules + flows)
      - name: Deploy Email Templates
        run: |
          if [ -d "force-app/main/default/email" ]; then
            sf project deploy start \
              --source-dir force-app/main/default/email \
              --target-org org-cible \
              --test-level NoTestRun \
              -w 20
          fi

      # =========================================================
      # PHASE 2 — BUSINESS LOGIC (SAFE DEPLOY)
      # =========================================================
      - name: PHASE 2 - Business Logic
        run: |

          sf project deploy start \
            --source-dir force-app/main/default/assignmentRules \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

          sf project deploy start \
            --source-dir force-app/main/default/autoResponseRules \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

          sf project deploy start \
            --source-dir force-app/main/default/layouts \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

          sf project deploy start \
            --source-dir force-app/main/default/flexipages \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # =========================================================
      # PHASE 3 — CODE + UI
      # =========================================================
      - name: PHASE 3 - Code & UI
        run: |

          sf project deploy start \
            --source-dir force-app/main/default/classes \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

          sf project deploy start \
            --source-dir force-app/main/default/lwc \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

          sf project deploy start \
            --source-dir force-app/main/default/aura \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

          sf project deploy start \
            --source-dir force-app/main/default/pages \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # =========================================================
      # PHASE 4 — FLOW SAFE DEPLOY (IMPORTANT)
      # =========================================================
      - name: PHASE 4 - SAFE FLOWS DEPLOY
        run: |
          mkdir tmp_flows
          cp -r force-app/main/default/flows tmp_flows/

          # ❌ remove unstable / AI / Agentforce flows
          rm -f tmp_flows/flows/Run_Agentforce_ServiceAgent.flow-meta.xml
          rm -f tmp_flows/flows/Trigger_Agent_On_Case.flow-meta.xml
          rm -f tmp_flows/flows/Record_Trigerred_flow_synch_case_sendSondageToCustomer.flow-meta.xml

          sf project deploy start \
            --source-dir tmp_flows/flows \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # =========================================================
      # PHASE 5 — REPORTING + FINAL UI
      # =========================================================
      - name: PHASE 5 - Reports & Dashboards
        run: |
          if [ -d "force-app/main/default/reports" ]; then
            sf project deploy start \
              --source-dir force-app/main/default/reports \
              --target-org org-cible \
              --test-level NoTestRun \
              -w 20
          fi

          if [ -d "force-app/main/default/dashboards" ]; then
            sf project deploy start \
              --source-dir force-app/main/default/dashboards \
              --target-org org-cible \
              --test-level NoTestRun \
              -w 20
          fi

      # =========================================================
      # FINAL STEP — TESTS
      # =========================================================
      - name: Run Apex Tests
        run: |
          sf apex run test \
            --target-org org-cible \
            --test-level RunLocalTests \
            --wait 20

      - name: Success
        if: success()
        run: echo "Deployment successful"

      - name: Failure
        if: failure()
        run: echo "Deployment failed"