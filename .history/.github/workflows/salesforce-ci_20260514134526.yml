name: Deploy to Sandbox UAT

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Setup Deployment Configuration
        run: sf config set restDeploy=false --global

      - name: Auth org cible via JWT
        run: |
          echo "${{ secrets.SF_TARGET_PRIVATE_KEY }}" > /tmp/server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_TARGET_CLIENT_ID }} \
            --jwt-key-file /tmp/server.key \
            --username ${{ secrets.SF_TARGET_USERNAME }} \
            --instance-url https://test.salesforce.com \
            --alias org-cible
          rm /tmp/server.key

      - name: 1 - Deploy Standard Value Sets
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/standardValueSets \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 2 - Deploy Queues
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/queues \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 3 - Deploy Objects
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/objects \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 4 - Deploy Apex Classes
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/classes \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 5 - Deploy LWC
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/lwc \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 6 - Deploy Aura
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/aura \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 7 - Patch Flexi Pages (remove unsupported Einstein components)
        run: |
          FLEXIPAGE="force-app/main/default/flexipages/Case_Record_Page.flexipage-meta.xml"
          if [ -f "$FLEXIPAGE" ]; then
            python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          import sys

          file_path = "force-app/main/default/flexipages/Case_Record_Page.flexipage-meta.xml"
          ET.register_namespace('', 'http://soap.sforce.com/2006/04/metadata')

          tree = ET.parse(file_path)
          root = tree.getroot()
          ns = {'sf': 'http://soap.sforce.com/2006/04/metadata'}

          UNSUPPORTED = {"runtime_service_predictions:einsteinFieldRecommendations"}

          def remove_unsupported(parent, tag):
              to_remove = []
              for child in parent.findall(tag, ns):
                  comp_name = child.find('sf:componentName', ns)
                  if comp_name is not None and comp_name.text in UNSUPPORTED:
                      print(f"Removing unsupported component: {comp_name.text}")
                      to_remove.append(child)
              for el in to_remove:
                  parent.remove(el)
              return len(to_remove)

          removed = 0
          # Components can be nested inside flexiPageRegions > layoutItems > componentInstances
          for region in root.findall('.//sf:flexiPageRegions', ns):
              for item in region.findall('.//sf:componentInstances', ns):
                  removed += remove_unsupported(item, 'sf:componentInstances')
              removed += remove_unsupported(region, 'sf:componentInstances')

          # Also check top-level componentInstances
          removed += remove_unsupported(root, 'sf:componentInstances')

          tree.write(file_path, encoding='utf-8', xml_declaration=True)
          print(f"Done. {removed} unsupported component(s) removed.")
          EOF
          fi

      - name: 8 - Deploy Flexi Pages
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/flexipages \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 9 - Deploy Labels
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/labels \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 10 - Deploy Tabs
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/tabs \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 11 - Deploy Layouts
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/layouts \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 12 - Deploy Assignment Rules
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/assignmentRules \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 13 - Deploy Auto Response Rules
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/autoResponseRules \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 14 - Deploy Flows
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/flows \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 15 - Deploy Permission Sets
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/permissionsets \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 16 - Deploy Pages
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/pages \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 17 - Deploy GenAI Prompt Templates
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/genAiPromptTemplates \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: 18 - Run Apex Tests
        run: |
          sf apex run test \
            --target-org org-cible \
            --test-level RunLocalTests \
            --wait 20

      - name: Notify Success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify Failure
        if: failure()
        run: echo "Deployment failed!"