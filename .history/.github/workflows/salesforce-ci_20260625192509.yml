name: Deploy to Sandbox UAT

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Display Salesforce CLI Version
        run: |
          sf --version
          sf plugins --core

      - name: Setup Deployment Configuration
        run: |
          sf config set org-metadata-rest-deploy=false --global

      - name: Auth org cible via JWT
        env:
          SF_TARGET_PRIVATE_KEY: ${{ secrets.SF_TARGET_PRIVATE_KEY }}
          SF_TARGET_CLIENT_ID: ${{ secrets.SF_TARGET_CLIENT_ID }}
          SF_TARGET_USERNAME: ${{ secrets.SF_TARGET_USERNAME }}
        run: |
          set -euo pipefail

          echo "Création temporaire de la clé JWT..."
          printf '%b' "$SF_TARGET_PRIVATE_KEY" | tr -d '\r' > /tmp/server.key
          chmod 600 /tmp/server.key

          sf org login jwt \
            --client-id "$SF_TARGET_CLIENT_ID" \
            --jwt-key-file /tmp/server.key \
            --username "$SF_TARGET_USERNAME" \
            --instance-url https://test.salesforce.com \
            --alias org-cible

          rm -f /tmp/server.key

          sf org display --target-org org-cible

      # -------------------------------------------------------------
      # HELPER DE DEPLOIEMENT
      # -------------------------------------------------------------
      - name: Create Deployment Helper
        run: |
          cat > deploy_existing_dirs.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          WAIT_TIME="$1"
          shift

          DIR_ARGS=()

          for dir in "$@"; do
            case "$dir" in
              dashboards|analyticsDashboards)
                echo "::warning::Déploiement bloqué volontairement pour le dossier: $dir"
                continue
                ;;
            esac

            path="force-app/main/default/$dir"

            if [ -d "$path" ]; then
              echo "Ajout au déploiement: $path"
              DIR_ARGS+=(--source-dir "$path")
            else
              echo "Dossier absent, ignoré: $path"
            fi
          done

          if [ ${#DIR_ARGS[@]} -eq 0 ]; then
            echo "Aucun dossier existant à déployer pour cette étape."
            exit 0
          fi

          sf project deploy start \
            "${DIR_ARGS[@]}" \
            --target-org org-cible \
            --api-version 65.0 \
            --test-level NoTestRun \
            --concise \
            --wait "$WAIT_TIME"
          BASH

          chmod +x deploy_existing_dirs.sh

      # -------------------------------------------------------------
      # 1. METADONNEES DE BASE
      # -------------------------------------------------------------
      - name: 1 - Deploy Core Metadata
        run: |
          ./deploy_existing_dirs.sh 30 \
            standardValueSets \
            globalValueSets \
            objects \
            customMetadata \
            customPermissions \
            queues \
            groups \
            duplicateRules

      # -------------------------------------------------------------
      # 2. CODE APEX ET INTEGRATIONS
      # -------------------------------------------------------------
      - name: 2 - Deploy Apex and Integration Metadata
        run: |
          ./deploy_existing_dirs.sh 30 \
            classes \
            triggers \
            namedCredentials \
            externalCredentials \
            certificates \
            authproviders \
            remoteSiteSettings \
            externalServices

      # -------------------------------------------------------------
      # 3. AGENTFORCE, PROMPT BUILDER ET FLOWS
      # IMPORTANT:
      # - On ne supprime PAS les fichiers *.botVersion-meta.xml
      # - Les BotVersion sont nécessaires pour déployer les agents.
      # - Les dashboards ne sont pas inclus.
      # -------------------------------------------------------------
      - name: 3 - Deploy Agentforce, Prompt Builder and Flows
        run: |
          ./deploy_existing_dirs.sh 60 \
            flows \
            genAiPromptTemplates \
            genAiPromptTemplateActivations \
            genAiFunctions \
            genAiPlugins \
            genAiPlannerBundles \
            aiAuthoringBundles \
            aiEvaluationDefinitions \
            aiTestingDefinitions \
            aiApplications \
            aiApplicationConfigs \
            aiAgentScorerDefinitions \
            botBlocks \
            botTemplates \
            bots

      # -------------------------------------------------------------
      # 4. INTERFACE UTILISATEUR ET EXPERIENCE CLOUD
      # -------------------------------------------------------------
      - name: 4 - Deploy UI Components and Experience Cloud
        run: |
          ./deploy_existing_dirs.sh 30 \
            lwc \
            aura \
            flexipages \
            quickActions \
            layouts \
            tabs \
            applications \
            navigationMenus \
            staticresources \
            contentassets \
            experiences \
            digitalExperiences \
            networks \
            sites \
            siteDotComSites \
            brandingSets

      # -------------------------------------------------------------
      # 5. LABELS ET TRADUCTIONS
      # -------------------------------------------------------------
      - name: 5 - Deploy Labels and Translations
        run: |
          ./deploy_existing_dirs.sh 20 \
            labels \
            translations \
            objectTranslations \
            globalValueSetTranslations

      # -------------------------------------------------------------
      # 6. REGLES DE GESTION ET DROITS
      # -------------------------------------------------------------
      - name: 6 - Deploy Rules and Permissions
        run: |
          ./deploy_existing_dirs.sh 30 \
            assignmentRules \
            autoResponseRules \
            escalationRules \
            matchingRules \
            sharingRules \
            workflows \
            permissionsets \
            permissionsetgroups \
            mutingpermissionsets \
            profiles \
            roles

      # -------------------------------------------------------------
      # 7. RAPPORTS ET TEMPLATES
      # Dashboards exclus volontairement.
      # -------------------------------------------------------------
      - name: 7 - Deploy Reports and Templates Without Dashboards
        run: |
          ./deploy_existing_dirs.sh 30 \
            email \
            pages \
            reports

      # -------------------------------------------------------------
      # 8. DEBUG
      # -------------------------------------------------------------
      - name: 8 - Display Full Error Report on Failure
        if: failure()
        run: |
          echo "Extraction du rapport de déploiement en cours..."
          sf project deploy report \
            --target-org org-cible \
            --use-most-recent \
            --json || true

      # -------------------------------------------------------------
      # 9. NOTIFICATIONS
      # -------------------------------------------------------------
      - name: Notify Success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify Failure
        if: failure()
        run: echo "Deployment failed!"