name: Deploy to Sandbox UAT

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Setup Deployment Configuration
        run: sf config set restDeploy=false --global

      - name: Auth org cible via JWT
        run: |
          echo "${{ secrets.SF_TARGET_PRIVATE_KEY }}" > /tmp/server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_TARGET_CLIENT_ID }} \
            --jwt-key-file /tmp/server.key \
            --username ${{ secrets.SF_TARGET_USERNAME }} \
            --instance-url https://test.salesforce.com \
            --alias org-cible
          rm /tmp/server.key

      # -------------------------
      # 1. BASE METADATA
      # -------------------------

      - name: Deploy Standard Value Sets
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/standardValueSets \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: Deploy Queues
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/queues \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: Deploy Objects
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/objects \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # -------------------------
      # 2. EMAIL / TEMPLATE SUPPORT
      # -------------------------

      - name: Deploy Email Templates
        run: |
          if [ -d "force-app/main/default/email" ]; then
            sf project deploy start \
              --source-dir force-app/main/default/email \
              --target-org org-cible \
              --test-level NoTestRun \
              -w 20
          else
            echo "No email templates folder found, skipping."
          fi

      # -------------------------
      # 3. BACKEND LOGIC (IMPORTANT FOR FLOWS)
      # -------------------------

      - name: Deploy Apex Classes
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/classes \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # -------------------------
      # 4. AI / AGENTFORCE DEPENDENCIES
      # -------------------------

      - name: Deploy GenAI Prompt Templates
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/genAiPromptTemplates \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # -------------------------
      # 5. UI / CONFIG
      # -------------------------

      - name: Deploy LWC
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/lwc \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: Deploy Aura
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/aura \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: Deploy Quick Actions
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/quickActions \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: Deploy Flexi Pages
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/flexipages \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: Deploy Labels
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/labels \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: Deploy Tabs
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/tabs \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: Deploy Layouts
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/layouts \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # -------------------------
      # 6. BUSINESS LOGIC (rules)
      # -------------------------

      - name: Deploy Assignment Rules
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/assignmentRules \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # -------------------------
      # 7. FLOWS (LAST STEP IMPORTANT)
      # -------------------------

      - name: Deploy Flows
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/flows \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # -------------------------
      # 8. PERMISSIONS
      # -------------------------

      - name: Deploy Permission Sets
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/permissionsets \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      # -------------------------
      # 9. REPORTING
      # -------------------------

      - name: Deploy Pages
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/pages \
            --target-org org-cible \
            --test-level NoTestRun \
            -w 20

      - name: Deploy Reports
        run: |
          if [ -d "force-app/main/default/reports" ]; then
            sf project deploy start \
              --source-dir force-app/main/default/reports \
              --target-org org-cible \
              --test-level NoTestRun \
              -w 20
          else
            echo "No reports folder found, skipping."
          fi

      - name: Deploy Dashboards
        run: |
          if [ -d "force-app/main/default/dashboards" ]; then
            sf project deploy start \
              --source-dir force-app/main/default/dashboards \
              --target-org org-cible \
              --test-level NoTestRun \
              -w 20
          else
            echo "No dashboards folder found, skipping."
          fi

      # -------------------------
      # 10. TESTS
      # -------------------------

      - name: Run Apex Tests
        run: |
          sf apex run test \
            --target-org org-cible \
            --test-level RunLocalTests \
            --wait 20

      # -------------------------
      # 11. NOTIFICATIONS
      # -------------------------

      - name: Notify Success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify Failure
        if: failure()
        run: echo "Deployment failed!"