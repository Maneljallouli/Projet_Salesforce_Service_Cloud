name: Deploy to Sandbox UAT

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Setup Deployment Configuration
        run: sf config set restDeploy=false --global

      - name: Auth org cible via JWT
        run: |
          echo "${{ secrets.SF_TARGET_PRIVATE_KEY }}" > /tmp/server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_TARGET_CLIENT_ID }} \
            --jwt-key-file /tmp/server.key \
            --username ${{ secrets.SF_TARGET_USERNAME }} \
            --instance-url https://salesforce.com \
            --alias org-cible
          rm /tmp/server.key

      # -------------------------------------------------------------
      # 1. METADONNÉES DE BASE
      # -------------------------------------------------------------
      - name: 1 - Deploy Core Metadata (ValueSets, Queues, Objects)
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/standardValueSets \
            --source-dir force-app/main/default/queues \
            --source-dir force-app/main/default/objects \
            --target-org org-cible \
            --test-level NoTestRun \
            --concise \
            -w 30

      # -------------------------------------------------------------
      # 2. CODE APEX & LOGIQUE BACKEND
      # -------------------------------------------------------------
      - name: 2 - Deploy Apex Classes
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/classes \
            --target-org org-cible \
            --test-level NoTestRun \
            --concise \
            -w 20

      # -------------------------------------------------------------
      # 3. BLOC AGENTFORCE & FLOWS (Compatibilité v66.0 avec nettoyage chirurgical)
      # -------------------------------------------------------------
      - name: 3 - Deploy Agentforce Core & Flows
        run: |
          echo "=== NETTOYAGE AGRESSIF DE L'WORKSPACE RUNNER ==="
          # 1. Suppression physique forcée des fichiers systèmes dupliqués ou obsolètes
          rm -f force-app/main/default/flows/Platform_Event_Triggered_Flow_Run_Agent.flow-meta.xml || true
          rm -f force-app/main/default/bots/Handbag_Support_Repair_Assistant/v1.botVersion-meta.xml || true
          rm -f force-app/main/default/bots/Handbag_Support_Repair_Assistant/Handbag_Support_Repair_Assistant.v1.botVersion-meta.xml || true

          # 2. Nettoyage automatique des références d'invocations systèmes standards (Asset Library)
          find force-app/main/default/genAiPlannerBundles/ -name "*.genAiPlannerBundle" -exec sed -i '/IdentifyRecordByName/d' {} + || true
          find force-app/main/default/genAiPlannerBundles/ -name "*.genAiPlannerBundle" -exec sed -i '/identifyRecordByName/d' {} + || true

          # FIX 1 : Nettoyer globalement les identifiants Sandbox restrictifs sur TOUS les fichiers (Planners, Plugins, etc.)
          echo "Correction des identifiants Sandbox restrictifs pour le flux de statut..."
          find force-app/main/default/ -type f -exec sed -i 's/AutoLaunchedFlow_Agent_Get_Case_Status_179AW0000001m7R/AutoLaunchedFlow_Agent_Get_Case_Status/g' {} + || true
          find force-app/main/default/ -type f -exec sed -i 's/AutoLaunchedFlow_Agent_Get_Case_Status_179AW0000001m93/AutoLaunchedFlow_Agent_Get_Case_Status/g' {} + || true

          # FIX 2 : Supprimer proprement le bloc d'instruction coupé à la ligne 159 d'EmployeeCopilotPlanner
          echo "Nettoyage du bloc XML corrompu en fin de fichier pour EmployeeCopilotPlanner..."
          if [ -f "force-app/main/default/genAiPlannerBundles/EmployeeCopilotPlanner/EmployeeCopilotPlanner.genAiPlannerBundle" ]; then
            # Supprime la ligne orpheline <genAiPluginInstructions> et ce qui suit, puis referme proprement les balises parentes
            sed -i '/<genAiPluginInstructions>/,/<\/localTopics>/d' force-app/main/default/genAiPlannerBundles/EmployeeCopilotPlanner/EmployeeCopilotPlanner.genAiPlannerBundle || true
            echo "    </localTopics>" >> force-app/main/default/genAiPlannerBundles/EmployeeCopilotPlanner/EmployeeCopilotPlanner.genAiPlannerBundle
            echo "</GenAiPlannerBundle>" >> force-app/main/default/genAiPlannerBundles/EmployeeCopilotPlanner/EmployeeCopilotPlanner.genAiPlannerBundle
          fi

          echo "=== PREPARATION DU REPERTOIRE DE DEPLOIEMENT ==="
          DIRS=""
          for dir in genAiPromptTemplates genAiPlannerBundles genAiPlugins genAiFunctions flows bots; do
            if [ -d "force-app/main/default/$dir" ]; then
              DIRS="$DIRS --source-dir force-app/main/default/$dir"
            fi
          done
          
          if [ ! -z "$DIRS" ]; then
            sf project deploy start \
              $DIRS \
              --target-org org-cible \
              --test-level NoTestRun \
              --concise \
              -w 40
          else
            echo "Aucun composant Agentforce ou Flow trouvé, étape ignorée."
          fi

      # -------------------------------------------------------------
      # 4. INTERFACE UTILISATEUR & CONFIGURATIONS VISUELLES
      # -------------------------------------------------------------
      - name: 4 - Deploy UI Components (LWC, Aura, Flexipages, QuickActions)
        run: |
          DIRS=""
          for dir in lwc aura flexipages quickActions layouts tabs; do
            if [ -d "force-app/main/default/$dir" ]; then
              DIRS="$DIRS --source-dir force-app/main/default/$dir"
            fi
          done
          sf project deploy start $DIRS --target-org org-cible --test-level NoTestRun --concise -w 30

      # -------------------------------------------------------------
      # 5. LABELS & TRADUCTIONS
      # -------------------------------------------------------------
      - name: 5 - Deploy Labels & Customization
        run: |
          sf project deploy start \
            --source-dir force-app/main/default/labels \
            --target-org org-cible \
            --test-level NoTestRun \
            --concise \
            -w 20

      # -------------------------------------------------------------
      # 6. RÈGLES DE GESTION & DROITS
      # -------------------------------------------------------------
      - name: 6 - Deploy Rules & Permissions (Assignment Rules, PermSets)
        run: |
          DIRS=""
          for dir in assignmentRules permissionsets; do
            if [ -d "force-app/main/default/$dir" ]; then
              DIRS="$DIRS --source-dir force-app/main/default/$dir"
            fi
          done
          sf project deploy start $DIRS --target-org org-cible --test-level NoTestRun --concise -w 20

      # -------------------------------------------------------------
      # 7. COMMUNICATIONS & RAPPORTS
      # -------------------------------------------------------------
      - name: 7 - Deploy Analytics & Templates (Templates, Reports, Dashboards, Pages)
        run: |
          DIRS=""
          for dir in email pages reports dashboards; do
            if [ -d "force-app/main/default/$dir" ]; then
              DIRS="$DIRS --source-dir force-app/main/default/$dir"
            fi
          done
          if [ ! -z "$DIRS" ]; then
            sf project deploy start $DIRS --target-org org-cible --test-level NoTestRun --concise -w 30
          fi

      # -------------------------------------------------------------
      # 8. TESTS UNITAIRES APEX
      # -------------------------------------------------------------
      - name: 8 - Run Apex Tests
        run: |
          sf apex run test \
            --target-org org-cible \
            --test-level RunLocalTests \
            --wait 30

      # -------------------------------------------------------------
      # 9. DEBUG - RAPPORT EN CAS D'ÉCHEC
      # -------------------------------------------------------------
      - name: 9 - Display Full Error Report on Failure
        if: failure()
        run: |
          echo "Extraction du rapport de déploiement en cours..."
          sf project deploy report --target-org org-cible --use-most-recent --json || true

      # -------------------------------------------------------------
      # 10. NOTIFICATIONS
      # -------------------------------------------------------------
      - name: Notify Success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify Failure
        if: failure()
        run: echo "Deployment failed!"
