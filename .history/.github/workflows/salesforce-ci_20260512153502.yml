name: Salesforce CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout du repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installation Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Installation Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # 4. Vérification installation CLI
      - name: Verify Salesforce CLI
        run: sf --version

      # 5. Authentification Sandbox UAT
      - name: Authenticate to ScUAT
        run: |
          echo "${{ secrets.UAT_AUTH_URL }}" > auth.txt
          sf org login sfdx-url \
            --sfdx-url-file auth.txt \
            --alias ScUAT \
            --set-default

      # 6. Vérification connexion org
      - name: Display Org
        run: sf org display --target-org ScUAT

      # 7. Déploiement metadata
      - name: Deploy Metadata to UAT
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org ScUAT \
            --wait 30 \
            --ignore-warnings

      # 8. Message succès
      - name: Deployment Completed
        run: echo "Deployment to ScUAT completed successfully"