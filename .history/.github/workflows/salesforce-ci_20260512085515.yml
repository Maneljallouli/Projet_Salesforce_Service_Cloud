name: Salesforce CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  ci-validation:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # Authenticate DEV Sandbox
      - name: Authenticate DEV Sandbox
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > dev_auth.txt
          sf org login sfdx-url --sfdx-url-file dev_auth.txt --alias DEV

      # Validation step disabled temporarily
      - name: Validate Deployment (TEMP DISABLED)
        if: false
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org DEV \
            --test-level RunLocalTests

  deploy-uat:
    needs: ci-validation
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Salesforce CLI
      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # Authenticate UAT Sandbox
      - name: Authenticate UAT Sandbox
        run: |
          echo "${{ secrets.UAT_AUTH_URL }}" > uat_auth.txt
          sf org login sfdx-url --sfdx-url-file uat_auth.txt --alias UAT

      # Deploy to UAT Sandbox
      - name: Deploy to UAT
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org UAT \
            --ignore-conflicts