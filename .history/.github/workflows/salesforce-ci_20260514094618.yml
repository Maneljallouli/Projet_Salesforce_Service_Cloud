name: Deploy to Sandbox UAT

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Setup Deployment Configuration
        run: sf config set restDeploy=false --global

      - name: Auth org cible via JWT
        run: |
          echo "${{ secrets.SF_TARGET_PRIVATE_KEY }}" > /tmp/server.key
          sf org login jwt \
            --client-id ${{ secrets.SF_TARGET_CLIENT_ID }} \
            --jwt-key-file /tmp/server.key \
            --username ${{ secrets.SF_TARGET_USERNAME }} \
            --instance-url https://test.salesforce.com \
            --alias org-cible
          rm /tmp/server.key

      - name: Deploy Metadata (exclude problematic folders)
        run: |
          echo "Deploying All Metadata"
          METADATA_PATHS=$(ls -d force-app/main/default/* | grep -Ev 'flowDefinitions|profiles|translations|bots|botVersions|genAiPlugins')
          echo "Deploying paths: $METADATA_PATHS"
          DEPLOY_ARGS=""
          for path in $METADATA_PATHS; do
            DEPLOY_ARGS="$DEPLOY_ARGS --source-dir $path"
          done
          echo "Deploy args: $DEPLOY_ARGS"
          sf project deploy start \
            $DEPLOY_ARGS \
            --target-org org-cible \
            --test-level RunLocalTests \
            -w 20

      - name: Notify Success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify Failure
        if: failure()
        run: echo "Deployment failed!"