name: Deploy to Sandbox UAT

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Display Salesforce CLI Version
        run: |
          sf --version
          sf plugins --core

      - name: Setup Deployment Configuration
        run: |
          sf config set org-metadata-rest-deploy=false --global

      - name: Auth org cible via JWT
        env:
          SF_TARGET_PRIVATE_KEY: ${{ secrets.SF_TARGET_PRIVATE_KEY }}
          SF_TARGET_CLIENT_ID: ${{ secrets.SF_TARGET_CLIENT_ID }}
          SF_TARGET_USERNAME: ${{ secrets.SF_TARGET_USERNAME }}
        run: |
          set -euo pipefail

          echo "Création temporaire de la clé JWT..."
          KEY_FILE="/tmp/server.key"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%b' "$SF_TARGET_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          sf org login jwt \
            --client-id "$SF_TARGET_CLIENT_ID" \
            --jwt-key-file "$KEY_FILE" \
            --username "$SF_TARGET_USERNAME" \
            --instance-url https://test.salesforce.com \
            --alias org-cible

          sf org display --target-org org-cible

      # -------------------------------------------------------------
      # HELPER DE DEPLOIEMENT
      # Accepte des dossiers et des fichiers précis.
      # Bloque volontairement les dashboards.
      # -------------------------------------------------------------
      - name: Create Deployment Helper
        run: |
          cat > deploy_existing_paths.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          WAIT_TIME="$1"
          shift

          SOURCE_ARGS=()

          for path in "$@"; do
            case "$path" in
              dashboards|*/dashboards|*/dashboards/*|analyticsDashboards|*/analyticsDashboards|*/analyticsDashboards/*)
                echo "::warning::Déploiement bloqué volontairement pour: $path"
                continue
                ;;
            esac

            if [ -e "$path" ]; then
              echo "Ajout au déploiement: $path"
              SOURCE_ARGS+=(--source-dir "$path")
            else
              echo "::notice::Chemin absent, ignoré: $path"
            fi
          done

          if [ ${#SOURCE_ARGS[@]} -eq 0 ]; then
            echo "Aucun fichier/dossier existant à déployer pour cette étape."
            exit 0
          fi

          sf project deploy start \
            "${SOURCE_ARGS[@]}" \
            --target-org org-cible \
            --api-version 66.0 \
            --test-level NoTestRun \
            --concise \
            --wait "$WAIT_TIME"
          BASH

          chmod +x deploy_existing_paths.sh

      # -------------------------------------------------------------
      # 1. METADONNEES DE BASE
      # Cette étape a déjà réussi dans ta pipeline.
      # -------------------------------------------------------------
      - name: 1 - Deploy Core Metadata
        run: |
          ./deploy_existing_paths.sh 30 \
            force-app/main/default/standardValueSets \
            force-app/main/default/globalValueSets \
            force-app/main/default/objects \
            force-app/main/default/customMetadata \
            force-app/main/default/customPermissions \
            force-app/main/default/queues \
            force-app/main/default/groups \
            force-app/main/default/duplicateRules

      # -------------------------------------------------------------
      # 2. INTEGRATIONS UNIQUEMENT
      # Pas de déploiement complet Apex/classes/triggers.
      # -------------------------------------------------------------
      - name: 2 - Deploy Integration Metadata Only
        run: |
          ./deploy_existing_paths.sh 20 \
            force-app/main/default/namedCredentials \
            force-app/main/default/externalCredentials \
            force-app/main/default/certificates \
            force-app/main/default/authproviders \
            force-app/main/default/remoteSiteSettings \
            force-app/main/default/externalServices

      # -------------------------------------------------------------
      # 3. VALIDATION DES FICHIERS CRITIQUES SERVICE_CLIENT_AI
      # -------------------------------------------------------------
      - name: 3 - Validate Service_Client_AI Critical Files
        run: |
          set -euo pipefail

          test -d force-app/main/default/bots/Service_Client_AI
          test -f force-app/main/default/bots/Service_Client_AI/Service_Client_AI.bot-meta.xml
          test -f force-app/main/default/bots/Service_Client_AI/v1.botVersion-meta.xml

          test -d force-app/main/default/genAiPlannerBundles/Service_Client_AI
          test -f force-app/main/default/genAiPlannerBundles/Service_Client_AI/Service_Client_AI.genAiPlannerBundle

          test -f force-app/main/default/flows/Autolaunched_Flow_Get_Email_Templates.flow-meta.xml
          test -f force-app/main/default/flows/Generate_Email_Draft_Action.flow-meta.xml
          test -f force-app/main/default/flows/AutoLaunchedFlowMergeAndSaveDraft.flow-meta.xml

          test -f force-app/main/default/genAiPromptTemplates/Choix_Du_Template.genAiPromptTemplate-meta.xml

          echo "Tous les fichiers critiques Service_Client_AI sont présents."

      # -------------------------------------------------------------
      # 4A. PROMPT BUILDER - TEMPLATES
      # Les prompts doivent être déployés avant les flows.
      # -------------------------------------------------------------
      - name: 4A - Deploy Prompt Builder Templates
        run: |
          ./deploy_existing_paths.sh 30 \
            force-app/main/default/genAiPromptTemplates/Auto_choix_emailTemplate.genAiPromptTemplate-meta.xml \
            force-app/main/default/genAiPromptTemplates/Case_Summary.genAiPromptTemplate-meta.xml \
            force-app/main/default/genAiPromptTemplates/Choix_Du_Template.genAiPromptTemplate-meta.xml \
            force-app/main/default/genAiPromptTemplates/Email_Case_Analyzer.genAiPromptTemplate-meta.xml

      # -------------------------------------------------------------
      # 4B. PROMPT BUILDER - ACTIVATIONS
      # Le helper ignore les fichiers absents.
      # -------------------------------------------------------------
      - name: 4B - Deploy Prompt Builder Activations
        run: |
          ./deploy_existing_paths.sh 30 \
            force-app/main/default/genAiPromptTemplateActivations/Auto_choix_emailTemplate.genAiPromptTemplateActivation-meta.xml \
            force-app/main/default/genAiPromptTemplateActivations/Case_Summary.genAiPromptTemplateActivation-meta.xml \
            force-app/main/default/genAiPromptTemplateActivations/Choix_Du_Template.genAiPromptTemplateActivation-meta.xml \
            force-app/main/default/genAiPromptTemplateActivations/Email_Case_Analyzer.genAiPromptTemplateActivation-meta.xml

      # -------------------------------------------------------------
      # 4C. PAUSE
      # Laisse Salesforce exposer les prompts comme actions Flow.
      # -------------------------------------------------------------
      - name: 4C - Wait for Prompt Builder Actions
        run: sleep 30

      # -------------------------------------------------------------
      # 4D. FLOWS UTILISES PAR SERVICE_CLIENT_AI
      # -------------------------------------------------------------
      - name: 4D - Deploy Service_Client_AI Flows
        run: |
          ./deploy_existing_paths.sh 45 \
            force-app/main/default/flows/Autolaunched_Flow_Get_Email_Templates.flow-meta.xml \
            force-app/main/default/flows/AutoLaunchedFlowMergeAndSaveDraft.flow-meta.xml \
            force-app/main/default/flows/Generate_Email_Draft_Action.flow-meta.xml

      # -------------------------------------------------------------
      # 4E. AGENTFORCE SERVICE_CLIENT_AI
      # Planner Bundle + Bot + BotVersion.
      # -------------------------------------------------------------
      - name: 4E - Deploy Agentforce Service_Client_AI
        run: |
          ./deploy_existing_paths.sh 60 \
            force-app/main/default/genAiPlannerBundles/Service_Client_AI \
            force-app/main/default/bots/Service_Client_AI

      # -------------------------------------------------------------
      # 5. UI COMPONENTS
      # Désactivé volontairement.
      #
      # Pourquoi ?
      # Le composant LWC caseChatFeed échoue car il référence:
      # CaseCommentController.postSupportMessage
      #
      # Comme l'objectif est Service_Client_AI seulement,
      # on ne déploie pas les LWC/Aura/Flexipages ici.
      # -------------------------------------------------------------
      - name: 5 - Skip UI Components
        run: |
          echo "UI deployment skipped intentionally."
          echo "Reason: Service_Client_AI deployment does not require LWC/Aura/Flexipages."
          echo "Avoiding unrelated error: caseChatFeed -> CaseCommentController.postSupportMessage."

      # -------------------------------------------------------------
      # 6. DEBUG
      # -------------------------------------------------------------
      - name: 6 - Display Full Error Report on Failure
        if: failure()
        run: |
          echo "Extraction du rapport de déploiement en cours..."
          sf project deploy report \
            --target-org org-cible \
            --use-most-recent \
            --json || true

      # -------------------------------------------------------------
      # 7. NOTIFICATIONS
      # -------------------------------------------------------------
      - name: Notify Success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify Failure
        if: failure()
        run: echo "Deployment failed!"