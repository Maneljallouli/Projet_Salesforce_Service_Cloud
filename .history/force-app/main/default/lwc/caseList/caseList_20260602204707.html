<template>
    <section class="lux-requests-page">

        <!-- Page header -->
        <div class="lux-page-header">
            <div>
                <p class="lux-page-kicker">Espace assistance</p>
                <h1 class="lux-page-title">Mes demandes</h1>
                <p class="lux-page-subtitle">
                    Suivez et gérez vos demandes d'assistance en toute simplicité.
                </p>
            </div>

            <div class="lux-page-count">
                {caseCount} demande(s)
            </div>
        </div>

        <!-- Toolbar -->
        <div class="lux-toolbar">

            <div class="lux-search">
                <lightning-icon 
                    icon-name="utility:search" 
                    size="small" 
                    class="lux-search-icon">
                </lightning-icon>

                <input
                    type="search"
                    placeholder="Rechercher une demande..."
                    value={searchTerm}
                    oninput={handleSearch}
                />
            </div>

            <div class="lux-filters">
                <button class={filterAllClass} data-filter="all" onclick={setFilter}>Tous</button>
                <button class={filterOpenClass} data-filter="open" onclick={setFilter}>Ouvert</button>
                <button class={filterProgressClass} data-filter="progress" onclick={setFilter}>En cours</button>
                <button class={filterResolvedClass} data-filter="resolved" onclick={setFilter}>Résolu</button>
                <button class={filterClosedClass} data-filter="closed" onclick={setFilter}>Fermé</button>
            </div>

            <button class="lux-new-request" onclick={handleCreateRequest}>
                <span class="lux-plus">+</span>
                Nouvelle demande
            </button>

        </div>

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="lux-state-card">
                <div class="lux-loader"></div>
                <p>Chargement de vos demandes...</p>
            </div>
        </template>

        <!-- Error -->
        <template if:true={hasError}>
            <div class="lux-error-card">
                Impossible de charger vos demandes pour le moment.
            </div>
        </template>

        <!-- Table -->
        <template if:true={hasDisplayedCases}>
            <div class="lux-table-card">

                <div class="lux-table-head">
                    <div>Référence</div>
                    <div>Objet</div>
                    <div>Catégorie</div>
                    <div>Statut</div>
                    <div>Date de création</div>
                    <div>Priorité</div>
                </div>

                <template for:each={displayedCases} for:item="c">
                    <div
                        key={c.Id}
                        class="lux-table-row"
                        data-id={c.Id}
                        onclick={openDetail}
                    >
                        <div class="lux-ref">
                            {c.CaseNumber}
                        </div>

                        <div class="lux-object">
                            <span class="lux-object-title">{c.Subject}</span>
                            <span class="lux-object-sub">
                                Dernière mise à jour : {c.formattedDate}
                            </span>
                        </div>

                        <div class="lux-category">
                            {c.Category__c}
                        </div>

                        <div class="lux-status">
                            <span class={c.statusClass}>{c.Status}</span>
                        </div>

                        <div class="lux-date">
                            {c.formattedDate}
                        </div>

                        <div class="lux-priority">
                            <span>{c.Priority}</span>
                        </div>
                    </div>
                </template>

            </div>
        </template>

        <!-- Empty -->
        <template if:true={showEmptyState}>
            <div class="lux-state-card">
                <div class="lux-empty-icon">—</div>
                <h3>Aucune demande trouvée</h3>
                <p>
                    Vous n'avez aucune demande correspondant à votre recherche ou au filtre sélectionné.
                </p>
            </div>
        </template>

    </section>
</template>
