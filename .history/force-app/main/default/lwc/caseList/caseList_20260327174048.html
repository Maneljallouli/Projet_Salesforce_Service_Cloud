<template>
    <div class="lux-card">
        <div class="lux-card-header">
            <h2 class="lux-title">Mes demandes</h2>
            <span class="lux-count">{caseCount} demande(s)</span>
        </div>

        <div class="lux-card-body">

            <template if:true={isLoading}>
                <div class="lux-loading">Chargement de votre historique...</div>
            </template>

            <template if:true={hasError}>
                <div class="lux-error">
                    Impossible de charger vos demandes. Veuillez réessayer plus tard.
                </div>
            </template>

            <template if:true={isEmpty}>
                <div class="lux-empty">
                    <p>Vous n'avez aucune demande pour le moment.</p>
                </div>
            </template>

            <template if:true={hasCases}>
                <div class="lux-list">
                    <template for:each={enrichedCases} for:item="c">
                        <div key={c.Id}
                             class="lux-row"
                             data-id={c.Id}
                             onclick={openDetail}>
                            
                            <div class="lux-row-left">
                                <span class="case-num">{c.CaseNumber}</span>
                                <span class="case-subject">{c.Subject}</span>
                                <span class="case-cat">{c.Category__c}</span>
                            </div>

                            <div class="lux-row-right">
                                <span class={c.statusClass}>{c.Status}</span>
                                <span class="case-date">{c.formattedDate}</span>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

        </div>
    </div>
</template>
