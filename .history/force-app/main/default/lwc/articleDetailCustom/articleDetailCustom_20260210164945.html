<template>
    <div class="luxury-container">
        <template if:true={articleData}>
            <h1 class="luxury-title">{title}</h1>
            <div class="luxury-divider"></div>
            <div class="luxury-content">
                <lightning-formatted-rich-text value={bodyContent}>
                </lightning-formatted-rich-text>
            </div>
        </template>

        <template if:false={articleData}>
            <div class="loading-state">
                <lightning-spinner alternative-text="Chargement..." size="small"></lightning-spinner>
                <p>Chargement de l'article...</p>
            </div>
        </template>
    </div>
</template>
