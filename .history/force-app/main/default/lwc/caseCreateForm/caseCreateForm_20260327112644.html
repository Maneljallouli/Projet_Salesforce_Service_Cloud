<template>
    <div class="lux-card">
        <div class="lux-card-header">
            <h2 class="lux-title">Nouvelle demande</h2>
            <p class="lux-subtitle">Notre équipe vous répond sous 24h</p>
        </div>

        <div class="lux-card-body">

            <template if:true={success}>
                <div class="lux-success">
                    <p>Votre demande a bien été enregistrée.</p>
                    <p class="case-number">{createdCaseId}</p>
                    <button class="lux-btn-ghost" onclick={reset}>
                        Nouvelle demande
                    </button>
                </div>
            </template>

            <template if:false={success}>

                <div class="lux-field">
                    <label>Sujet *</label>
                    <input
                        type="text"
                        value={subject}
                        onchange={handleSubject}
                        placeholder="Décrivez brièvement votre demande"/>
                </div>

                <div class="lux-field">
                    <label>Type de demande *</label>
                    <select onchange={handleCategory}>
                        <option value="">-- Sélectionner --</option>
                        <template for:each={categoryOptions} for:item="opt">
                            <option key={opt.value} value={opt.value}>
                                {opt.label}
                            </option>
                        </template>
                    </select>
                </div>

                <template if:true={hasSubcategories}>
                    <div class="lux-field">
                        <label>Sous-catégorie</label>
                        <select onchange={handleSubcategory}>
                            <option value="">-- Sélectionner --</option>
                            <template for:each={subcategoryOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>
                                    {opt.label}
                                </option>
                            </template>
                        </select>
                    </div>
                </template>

                <div class="lux-field">
                    <label>Description *</label>
                    <textarea
                        rows="5"
                        onchange={handleDescription}
                        placeholder="Détaillez votre demande...">{description}</textarea>
                        placeholder="Détaillez votre demande...">
                    </textarea>
                </div>

                <template if:true={errorMsg}>
                    <div class="lux-error">{errorMsg}</div>
                </template>

                <button
                    class="lux-btn"
                    onclick={handleSubmit}
                    disabled={isLoading}>
                    <template if:true={isLoading}>Envoi en cours...</template>
                    <template if:false={isLoading}>Envoyer la demande</template>
                </button>

            </template>
        </div>
    </div>
</template>
