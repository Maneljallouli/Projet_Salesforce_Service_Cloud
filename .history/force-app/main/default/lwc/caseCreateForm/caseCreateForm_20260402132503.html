<template>
    <div class="lux-card">
        <div class="lux-card-header">
            <h2 class="lux-title">Nouvelle demande</h2>
            <p class="lux-subtitle">L'excellence Maison Luxe à votre service</p>
            <div class="lux-style-lines">
                <span class="line-gold"></span>
                <span class="line-beige"></span>
            </div>
        </div>

        <div class="lux-card-body">
            <template if:true={success}>
                <div class="lux-success">
                    <p>Votre demande a été enregistrée.</p>
                    <p class="case-number">ID Dossier : {createdCaseId}</p>
                    
                    <div style="margin: 2rem 0; padding: 1.5rem; border: 1px dashed #C4A35A; background: #fffaf0;">
                        <label style="font-weight:bold; color:#3C3C3B; margin-bottom:10px; display:block;">
                            DOCUMENTS (PHOTO DU DOMMAGE, FACTURE OU GARANTIE)
                        </label>
                        <p style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">
                            Formats acceptés : JPG, PNG, PDF.
                        </p>
                        <lightning-file-upload
                            label=""
                            name="fileUploader"
                            accept=".png,.jpg,.jpeg,.pdf"
                            record-id={createdCaseId}
                            onuploadfinished={handleUploadFinished}
                            multiple>
                        </lightning-file-upload>
                    </div>

                    <button class="lux-btn" onclick={reset}>NOUVELLE DEMANDE</button>
                </div>
            </template>

            <template if:false={success}>
                <div class="lux-field">
                    <label>SUJET *</label>
                    <input type="text" value={subject} onchange={handleSubject} placeholder="Ex: Problème de fermeture..."/>
                </div>

                <div class="lux-field">
                    <label>PRODUIT CONCERNÉ</label>
                    <select class="lux-select" onchange={handleProductChange}>
                        <option value="">-- Choisir parmi ma collection --</option>
                        <template for:each={myProducts} for:item="p">
                            <option key={p.Id} value={p.Id}>{p.Name}</option>
                        </template>
                    </select>
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="lux-field" style="flex: 1;">
                        <label>DATE D'ACHAT</label>
                        <input type="date" onchange={handleDateChange} />
                    </div>
                    <div class="lux-field" style="flex: 1;">
                        <label>CANAL D'ACHAT</label>
                        <select class="lux-select" onchange={handleChannelChange}>
                            <option value="Online">Online</option>
                            <option value="Boutique">Boutique</option>
                            <option value="Héritage">Héritage</option>
                            <option value="Seconde main">Seconde main</option>
                        </select>
                    </div>
                </div>

                <div class="lux-field">
                    <label>NUMÉRO DE COMMANDE</label>
                    <input type="text" value={orderNumber} onchange={handleOrderNumber} placeholder="Ex: MJ-2026-X"/>
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="lux-field" style="flex: 1;">
                        <label>CATÉGORIE *</label>
                        <select class="lux-select" onchange={handleCategory}>
                            <option value="">-- Sélectionner --</option>
                            <template for:each={categoryOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                    </div>

                    <template if:true={hasSubcategories}>
                        <div class="lux-field" style="flex: 1;">
                            <label>SOUS-CATÉGORIE</label>
                            <select class="lux-select" onchange={handleSubcategory}>
                                <option value="">-- Sélectionner --</option>
                                <template for:each={subcategoryOptions} for:item="opt">
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </template>
                </div>

                <div class="lux-field">
                    <label>DESCRIPTION *</label>
                    <textarea onchange={handleDescription} placeholder="Décrivez précisément votre besoin..."></textarea>
                </div>

                <template if:true={errorMsg}>
                    <div class="lux-error">{errorMsg}</div>
                </template>

                <button class="lux-btn" onclick={handleSubmit} disabled={isLoading}>
                    <template if:false={isLoading}>ENVOYER LA DEMANDE</template>
                    <template if:true={isLoading}>TRAITEMENT...</template>
                </button>
            </template>
        </div>
    </div>
</template>
