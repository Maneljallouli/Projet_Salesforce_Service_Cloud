<template>
    <div class="lux-card">
        <div class="lux-card-header">
            <h2 class="lux-title">Maison Luxe - Service Après-Vente</h2>
            <div class="lux-style-lines"><span class="line-gold"></span><span class="line-beige"></span></div>
        </div>

        <div class="lux-card-body">
            <template if:true={success}>
                <div class="lux-success">
                    <p>Votre demande et vos documents ont été transmis à nos ateliers.</p>
                    <button class="lux-btn" onclick={reset}>NOUVELLE DEMANDE</button>
                </div>
            </template>

            <template if:false={success}>
                <div class="lux-field">
                    <label>SUJET DE LA DEMANDE *</label>
                    <input type="text" onchange={handleSubject} placeholder="Ex: Réparation fermoir..."/>
                </div>

                <div class="lux-field">
                    <label>JOINDRE UN DOCUMENT (PHOTO, FACTURE, GARANTIE)</label>
                    <div class="custom-upload">
                        <input type="file" id="file-upload" class="hidden-input" onchange={handleFileChange}/>
                        <label for="file-upload" class="upload-label">
                            <span class="icon">📁</span>
                            <span class="text">{fileName}</span>
                            <template if:false={fileName}>Sélectionner un fichier...</template>
                        </label>
                    </div>
                </div>

                <div class="lux-field">
                    <label>PRODUIT CONCERNÉ</label>
                    <select class="lux-select" onchange={handleProductChange}>
                        <option value="">-- Ma Collection --</option>
                        <template for:each={myProducts} for:item="p">
                            <option key={p.Id} value={p.Id}>{p.Name}</option>
                        </template>
                    </select>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="lux-field" style="flex: 1;">
                        <label>DATE D'ACHAT</label>
                        <input type="date" onchange={handleDateChange}/>
                    </div>
                    <div class="lux-field" style="flex: 1;">
                        <label>CANAL D'ACHAT</label>
                        <select class="lux-select" onchange={handleChannelChange}>
                            <option value="Online">Boutique en ligne</option>
                            <option value="Boutique">Boutique physique</option>
                            <option value="Héritage">Héritage / Cadeau</option>
                        </select>
                    </div>
                </div>

                <div class="lux-field">
                    <label>NUMÉRO DE COMMANDE</label>
                    <input type="text" onchange={handleOrderNumber} placeholder="MJ-XXXXX"/>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="lux-field" style="flex: 1;">
                        <label>CATÉGORIE *</label>
                        <select class="lux-select" onchange={handleCategory}>
                            <option value="">-- Choisir --</option>
                            <template for:each={categoryOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                    </div>
                    <template if:true={hasSubcategories}>
                        <div class="lux-field" style="flex: 1;">
                            <label>SOUS-CATÉGORIE</label>
                            <select class="lux-select" onchange={handleSubcategory}>
                                <template for:each={subcategoryOptions} for:item="opt">
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </template>
                </div>

                <div class="lux-field">
                    <label>MESSAGE *</label>
                    <textarea onchange={handleDescription} placeholder="Décrivez votre besoin en détail..."></textarea>
                </div>

                <template if:true={errorMsg}>
                    <p class="error-text">{errorMsg}</p>
                </template>

                <button class="lux-btn" onclick={handleSubmit} disabled={isLoading}>
                    <template if:false={isLoading}>TRANSMETTRE MON DOSSIER</template>
                    <template if:true={isLoading}>ENVOI EN COURS...</template>
                </button>
            </template>
        </div>
    </div>
</template>
