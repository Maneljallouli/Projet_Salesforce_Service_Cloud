<template>
    <div class="lux-card">
        <div class="lux-card-header">
            <h2 class="lux-title">Nouvelle demande</h2>
            <p class="lux-subtitle">L'excellence Maison Luxe à votre service</p>
            <div class="lux-style-lines"><span class="line-gold"></span><span class="line-beige"></span></div>
        </div>

        <div class="lux-card-body">
            <template if:true={success}>
                <div class="lux-success">
                    <div class="success-icon">✔</div>
                    <p>Votre dossier complet a été transmis avec succès à nos artisans.</p>
                    <button class="lux-btn" onclick={reset}>NOUVELLE DEMANDE</button>
                </div>
            </template>

            <template if:false={success}>
                <div class="lux-field">
                    <label>SUJET *</label>
                    <input type="text" onchange={handleSubject} placeholder="Objet de votre demande..."/>
                </div>

                <div class="lux-field">
                    <label>JUSTIFICATIF (PHOTO, FACTURE OU GARANTIE)</label>
                    <div class="custom-file-input">
                        <input type="file" id="fileInput" onchange={handleFileChange} class="hidden-input"/>
                        <label for="fileInput" class="file-label">
                            <span class="paperclip">📎</span>
                            <span class="file-name">{fileName}</span>
                            <template if:false={fileName}>Choisir un fichier...</template>
                        </label>
                    </div>
                </div>

                <div class="lux-field">
                    <label>PRODUIT CONCERNÉ</label>
                    <select class="lux-select" onchange={handleProductChange}>
                        <option value="">-- Sélectionner un produit --</option>
                        <template for:each={myProducts} for:item="p">
                            <option key={p.Id} value={p.Id}>{p.Name}</option>
                        </template>
                    </select>
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="lux-field" style="flex: 1;">
                        <label>CATÉGORIE *</label>
                        <select class="lux-select" onchange={handleCategory}>
                            <option value="">-- Choisir --</option>
                            <template for:each={categoryOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                    </div>
                    <template if:true={hasSubcategories}>
                        <div class="lux-field" style="flex: 1;">
                            <label>SOUS-CATÉGORIE</label>
                            <select class="lux-select" onchange={handleSubcategory}>
                                <option value="">-- Choisir --</option>
                                <template for:each={subcategoryOptions} for:item="opt">
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </template>
                </div>

                <div class="lux-field">
                    <label>DESCRIPTION *</label>
                    <textarea onchange={handleDescription} placeholder="Détaillez votre besoin..."></textarea>
                </div>

                <template if:true={errorMsg}>
                    <p class="lux-error">{errorMsg}</p>
                </template>

                <button class="lux-btn" onclick={handleSubmit} disabled={isLoading}>
                    <template if:false={isLoading}>SOUMETTRE LE DOSSIER</template>
                    <template if:true={isLoading}>ENVOI EN COURS...</template>
                </button>
            </template>
        </div>
    </div>
</template>
