<template>
    <div class="lux-card">
        <div class="lux-card-header">
            <h2 class="lux-title">Maison Luxe SAV</h2>
            <p class="lux-subtitle">L'excellence à votre service</p>
            <div class="lux-style-lines"><span class="line-gold"></span><span class="line-beige"></span></div>
        </div>

        <div class="lux-card-body">
            <template if:true={success}>
                <div class="lux-success">
                    <p class="case-number">Dossier Transmis</p>
                    <p>Nos artisans ont bien reçu votre demande et vos justificatifs.</p>
                    <button class="lux-btn" onclick={reset}>Nouvelle demande</button>
                </div>
            </template>

            <template if:false={success}>
                <div class="lux-field">
                    <label>Sujet *</label>
                    <input type="text" onchange={handleSubject} placeholder="Ex: Réparation..."/>
                </div>

                
                <div class="lux-field">
                    <label>Produit concerné</label>
                    <select onchange={handleProductChange}>
                        <option value="">-- Ma Collection --</option>
                        <template for:each={myProducts} for:item="p">
                            <option key={p.Id} value={p.Id}>{p.Name}</option>
                        </template>
                    </select>
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="lux-field" style="flex: 1;">
                        <label>Date d'achat</label>
                        <input type="date" onchange={handleDateChange}/>
                    </div>
                    <div class="lux-field" style="flex: 1;">
                        <label>Canal</label>
                        <select onchange={handleChannelChange}>
                            <option value="Online">Online</option>
                            <option value="Boutique">Boutique</option>
                        </select>
                    </div>
                </div>

                <div class="lux-field">
                    <label>N° Commande</label>
                    <input type="text" onchange={handleOrderNumber}/>
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="lux-field" style="flex: 1;">
                        <label>Catégorie *</label>
                        <select onchange={handleCategory}>
                            <option value="">-- Choisir --</option>
                            <template for:each={categoryOptions} for:item="opt">
                                <option key={opt.value} value={opt.value}>{opt.label}</option>
                            </template>
                        </select>
                    </div>
                    <template if:true={hasSubcategories}>
                        <div class="lux-field" style="flex: 1;">
                            <label>Sous-catégorie</label>
                            <select onchange={handleSubcategory}>
                                <template for:each={subcategoryOptions} for:item="opt">
                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </template>
                </div>

                <div class="lux-field">
                    <label>Description *</label>
                    <textarea onchange={handleDescription}></textarea>
                </div>
                <div class="lux-field">
                    <label>Photo du produit ou Facture</label>
                    <input type="file" id="fileInput" onchange={handleFileChange} style="display:none;"/>
                    <label for="fileInput" class="lux-btn-ghost" style="display:block; text-align:center;">
                        <template if:false={fileName}>Joindre un fichier (📎)</template>
                        <template if:true={fileName}>{fileName}</template>
                    </label>
                </div>


                <template if:true={errorMsg}><p class="lux-error">{errorMsg}</p></template>

                <button class="lux-btn" onclick={handleSubmit} disabled={isLoading}>
                    <template if:false={isLoading}>Soumettre le dossier complet</template>
                    <template if:true={isLoading}>Traitement en cours...</template>
                </button>
            </template>
        </div>
    </div>
</template>
