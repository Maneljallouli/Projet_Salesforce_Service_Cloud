<template>
    <div class="cLogin">
        <div class="login-banner">
            MAISON LUXE<br/>ESPACE CLIENT PRIVÉ
        </div>

        <div class="login-form">
            <input type="text" 
                   placeholder="Nom d’utilisateur" 
                   value={username} 
                   onchange={handleUsername} />

            <input type="password" 
                   placeholder="Mot de passe" 
                   value={password} 
                   onchange={handlePassword} />

            <button type="button" 
                    onclick={handleLogin} 
                    disabled={isLoading}>
                {isLoading ? 'Connexion...' : 'Connexion'}
            </button>

            <p class="error-msg" if:true={errorMsg}>{errorMsg}</p>
        </div>
    </div>
</template>
