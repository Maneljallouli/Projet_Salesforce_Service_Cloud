<template>
    <article class="slds-card chat-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:case" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title"><strong>Case Activity & Discussion</strong></h2>
                </div>
            </header>
        </div>

        <div class="slds-card__body slds-p-around_medium scrollable-content">
            <template if:true={historyData}>
                <template for:each={historyData} for:item="item">
                    <div key={item.id} class={item.cssClass}>
                        <div class="slds-media">
                            <div class="slds-media__figure">
                                <lightning-icon icon-name={item.icon} size="x-small"></lightning-icon>
                            </div>
                            <div class="slds-media__body">
                                <div class="slds-grid slds-grid_align-spread">
                                    <span class="user-label">{item.author}</span>
                                    <span class="date-label">
                                        <lightning-formatted-date-time value={item.createdDate} hour="2-digit" minute="2-digit" day="2-digit" month="short"></lightning-formatted-date-time>
                                    </span>
                                </div>
                                <p class="content-text">{item.body}</p>
                            </div>
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <footer class="slds-card__footer reply-box">
            <lightning-textarea label="Reply" variant="label-hidden" placeholder="Type your message..." value={userInput} onchange={handleInputChange}></lightning-textarea>
            <div class="slds-text-align_right slds-m-top_small">
                <lightning-button label="Send Message" variant="brand" onclick={handleSend}></lightning-button>
            </div>
        </footer>
    </article>
</template>
