<template>
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:log_a_call" size="small"></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">Fil d'activité</h2>
                </div>
            </header>
        </div>
        <div class="slds-card__body slds-p-around_medium">
            <template if:true={history.data}>
                <ul class="slds-feed__list">
                    <template for:each={history.data} for:item="item">
                        <li key={item.id} class="slds-feed__item slds-box slds-m-bottom_small custom-item">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name={item.icon} size="small"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <div class="slds-grid slds-grid_align-spread">
                                        <strong>{item.author}</strong>
                                        <lightning-formatted-date-time 
                                            value={item.createdDate} 
                                            year="numeric" month="short" day="2-digit" 
                                            hour="2-digit" minute="2-digit">
                                        </lightning-formatted-date-time>
                                    </div>
                                    <p class="slds-p-top_x-small">{item.body}</p>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
        </div>
    </article>
</template>
