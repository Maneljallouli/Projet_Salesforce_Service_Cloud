<template>
    <div class="slds-card slds-p-around_medium">
        <div class="chat-feed">
            <template for:each={commentsData} for:item="comment">
                <div key={comment.id} class="comment-bubble slds-m-bottom_small">
                    <div class="comment-header">
                        <span class="author-name">{comment.author}</span>
                        <span class="comment-date">
                            <lightning-formatted-date-time 
                                value={comment.createdDate} 
                                year="numeric" month="short" day="2-digit" 
                                hour="2-digit" minute="2-digit" hour12="false">
                            </lightning-formatted-date-time>
                        </span>
                    </div>
                    <div class="comment-body">
                        {comment.body}
                    </div>
                </div>
            </template>
        </div>

        <div class="reply-section slds-m-top_medium">
            <lightning-textarea 
                placeholder="Type your message here..." 
                value={userInput} 
                onchange={handleInputChange}>
            </lightning-textarea>
            <lightning-button 
                label="Send Message" 
                onclick={handleSend} 
                variant="brand" 
                class="slds-float_right slds-m-top_x-small">
            </lightning-button>
        </div>
    </div>
</template>
