<template>
    <div class="chat-container">
        <div class="comments-list">
            <template for:each={commentsData} for:item="comment">
                <div key={comment.id} class="message-bubble">
                    <p><strong>{comment.author}</strong></p>
                    <p>{comment.body}</p>
                </div>
            </template>
        </div>
        
        <lightning-textarea value={userInput} onchange={handleInputChange}></lightning-textarea>
        <lightning-button label="Send Message" onclick={handleSend}></lightning-button>
    </div>
</template>
