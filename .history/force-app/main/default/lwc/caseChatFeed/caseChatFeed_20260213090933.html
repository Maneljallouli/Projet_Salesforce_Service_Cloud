<template>
    <lightning-card title="Support Client - Discussions" icon-name="standard:case_comment">
        <div class="slds-p-around_medium feed-container">
            <template if:true={comments.data}>
                <template for:each={comments.data} for:item="comment">
                    <div key={comment.Id} class="comment-bubble-wrapper">
                        <div class="comment-bubble">
                            <div class="comment-header">
                                <strong>{comment.CreatedBy.Name}</strong>
                                <span class="comment-date">{comment.FormattedDate}</span>
                            </div>
                            <p class="comment-body">{comment.CommentBody}</p>
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <div class="slds-p-around_medium footer-input">
            <lightning-textarea 
                label="Votre réponse" 
                placeholder="Écrivez un message ici..."
                value={newComment}
                onchange={handleInputChange}
                variant="label-hidden">
            </lightning-textarea>
            <lightning-button 
                label="Envoyer" 
                variant="brand" 
                onclick={handleSubmit} 
                class="slds-m-top_x-small slds-float_right"
                disabled={isButtonDisabled}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
