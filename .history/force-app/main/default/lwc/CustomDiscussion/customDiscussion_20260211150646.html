<template>
    <!-- HERO / INTRO -->
    <div class="hero">
        <h1 class="hero-title">💬 Centre d’entraide communautaire</h1>
        <p class="hero-subtitle">
            Posez vos questions et échangez avec notre communauté et notre équipe.
        </p>
    </div>

    <!-- CONTENEUR PRINCIPAL -->
    <div class="luxury-container">

        <!-- TITRE -->
        <h2 class="title">Discussions</h2>

        <!-- ZONE DE SAISIE -->
        <div class="input-box">
            <lightning-textarea
                value={newMessage}
                onchange={handleTextChange}
                variant="label-hidden"
                placeholder="Écrivez votre question ici...">
            </lightning-textarea>

            <button class="btn-gold" onclick={handlePost}>
                Publier la question
            </button>
        </div>

        <!-- LISTE DES DISCUSSIONS -->
        <div class="feed-list">
            <template if:true={discussions}>
                <template for:each={discussions} for:item="dis">
                    <div key={dis.id} class="post-card">

                        <!-- META -->
                        <div class="meta">
                            <span class="user">
                                {dis.actor.name}
                            </span>
                            <span class="date">
                                {dis.createdDate}
                            </span>
                        </div>

                        <!-- CONTENU -->
                        <div class="content">
                            <template for:each={dis.body.messageSegments} for:item="seg">
                                <span key={seg.text}>
                                    {seg.text}
                                </span>
                            </template>
                        </div>

                    </div>
                </template>
            </template>

            <!-- AUCUNE DONNÉE -->
            <template if:false={discussions}>
                <p class="empty-state">
                    Aucune discussion pour le moment. Soyez le premier à poser une question.
                </p>
            </template>
        </div>

    </div>
</template>
