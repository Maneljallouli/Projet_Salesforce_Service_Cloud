<template>
    <div id="mon-espace-discussion" class="luxury-container">
        <h2 class="title">Espace Discussions Premium</h2>
        
        <div class="input-box">
            <lightning-textarea 
                value={newMessage} 
                onchange={handleTextChange}
                variant="label-hidden"
                placeholder="Posez votre question à nos experts...">
            </lightning-textarea>
            <button class="btn-gold" onclick={handlePost}>Publier la Question</button>
        </div>

        <div class="feed-list">
            <template if:true={discussions}>
                <template for:each={discussions} for:item="dis">
                    <div key={dis.Id} class="post-card">
                        <div class="meta">
                            <span class="user">{dis.CreatedBy.Name}</span>
                            <span class="date">{dis.CreatedDate}</span>
                        </div>
                        <p class="content">{dis.Body}</p>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>
