<template>
    <div class="luxury-container">
        <h2 class="title">Espace Discussions</h2>
        
        <div class="input-box">
            <lightning-textarea 
                value={newMessage} 
                onchange={handleTextChange}
                variant="label-hidden"
                placeholder="Votre question ici..."></lightning-textarea>
            <button class="btn-gold" onclick={handlePost}>Publier</button>
        </div>

        <template if:true={discussions}>
            <template for:each={discussions} for:item="dis">
                <div key={dis.Id} class="post">
                    <div class="meta"><strong>{dis.CreatedBy.Name}</strong> • {dis.CreatedDate}</div>
                    <p class="content">{dis.Body}</p>
                </div>
            </template>
        </template>
    </div>
</template>
