<template>
    <article class="ai-card">
        <!-- Header -->
        <div class="ai-card__header slds-grid slds-grid_vertical-align-center slds-wrap slds-gutters_small">
            <div class="slds-col slds-grow">
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <span class="ai-icon-wrapper">
                            <lightning-icon
                                icon-name="utility:magicwand"
                                size="x-small"
                                alternative-text="IA"
                                class="ai-icon">
                            </lightning-icon>
                        </span>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="ai-title">Réponse suggérée par l’IA</h2>
                        <p class="ai-subtitle">Brouillon généré à partir du contexte du case</p>
                    </div>
                </div>
            </div>

            <div class="slds-col slds-no-flex">
                <template if:true={isDraftReady}>
                    <span class="ai-badge">Prêt à valider</span>
                </template>
            </div>
        </div>

        <template if:true={hasData}>
            <div class="ai-card__body slds-p-around_medium">
                
                <!-- Bloc synthèse -->
                <section class="ai-highlight slds-m-bottom_medium">
                    <div class="ai-highlight__header">
                        <lightning-icon
                            icon-name="utility:lightbulb"
                            size="xx-small"
                            alternative-text="Synthèse"
                            class="ai-highlight__icon">
                        </lightning-icon>
                        <span class="ai-highlight__label">Synthèse IA</span>
                    </div>
                    <p class="ai-highlight__text">{analyse}</p>
                </section>

                <!-- Corps -->
                <section class="ai-shell">
                    <!-- Formulaire email -->
                    <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <lightning-input
                                label="À"
                                type="email"
                                value={toAddress}
                                onchange={handleToChange}
                                variant="label-stacked">
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <lightning-input
                                label="Cc"
                                type="email"
                                value={ccAddress}
                                onchange={handleCcChange}
                                variant="label-stacked">
                            </lightning-input>
                        </div>

                        <div class="slds-col slds-size_1-of-1">
                            <lightning-input
                                label="Objet"
                                value={subject}
                                onchange={handleSubjectChange}
                                variant="label-stacked">
                            </lightning-input>
                        </div>
                    </div>

                    <!-- Mode aperçu -->
                    <template if:false={isEditing}>
                        <div class="ai-editor__toolbar slds-m-bottom_small">
                            <span class="ai-editor__label">Brouillon modifiable</span>

                            <div class="ai-tabs" role="tablist" aria-label="Mode d'affichage">
                                <button type="button" class="ai-tab active" data-tab="apercu" onclick={handleTab}>
                                    Aperçu
                                </button>
                                <button type="button" class="ai-tab" data-tab="modifier" onclick={handleTab}>
                                    Modifier
                                </button>
                            </div>
                        </div>

                        <div class="ai-preview" lwc:dom="manual" data-id="preview"></div>
                    </template>

                    <!-- Mode édition -->
                    <template if:true={isEditing}>
                        <div class="ai-editor__toolbar slds-m-bottom_small">
                            <span class="ai-editor__label">Brouillon modifiable</span>

                            <div class="ai-tabs" role="tablist" aria-label="Mode d'affichage">
                                <button type="button" class="ai-tab" data-tab="apercu" onclick={handleTab}>
                                    Aperçu
                                </button>
                                <button type="button" class="ai-tab active" data-tab="modifier" onclick={handleTab}>
                                    Modifier
                                </button>
                            </div>
                        </div>

                        <div class="ai-richtext-wrap">
                            <lightning-input-rich-text
                                value={draftBody}
                                onchange={handleTextChange}>
                            </lightning-input-rich-text>
                        </div>
                    </template>
                </section>

                <!-- Actions -->
                <div class="ai-actions">
                    <lightning-button
                        label="Ignorer"
                        onclick={handleIgnore}
                        class="ai-neutral-btn">
                    </lightning-button>

                    <lightning-button
                        label="Valider et envoyer"
                        variant="brand"
                        icon-name="utility:email"
                        icon-position="left"
                        onclick={handleSend}
                        class="ai-brand-btn">
                    </lightning-button>
                </div>
            </div>
        </template>

        <!-- Empty / loading -->
        <template if:false={hasData}>
            <div class="ai-empty">
                <div class="ai-empty__icon slds-m-bottom_small">
                    <lightning-icon
                        icon-name="utility:magicwand"
                        size="small"
                        alternative-text="IA"
                        class="ai-empty-icon">
                    </lightning-icon>
                </div>

                <template if:true={loading}>
                    <div class="slds-is-relative slds-m-bottom_medium ai-spinner-wrap">
                        <lightning-spinner size="small" variant="brand"></lightning-spinner>
                    </div>
                    <p class="ai-empty__title">Génération de la réponse en cours…</p>
                    <p class="ai-empty__text">L’IA analyse le case et prépare un brouillon.</p>
                </template>

                <template if:false={loading}>
                    <p class="ai-empty__title">Aucune réponse suggérée pour le moment</p>
                    <p class="ai-empty__text">Lancez l’analyse ou attendez une nouvelle proposition.</p>
                </template>
            </div>
        </template>
    </article>
</template>
