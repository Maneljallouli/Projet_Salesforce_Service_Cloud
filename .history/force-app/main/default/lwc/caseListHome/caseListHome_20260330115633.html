<template>
    <div class="lux-case-list-container">
        <h3 class="lux-case-title">DERNIÈRES DEMANDES</h3>
        
        <template if:true={hasCases}>
            <div class="lux-case-items">
                <template for:each={enrichedCases} for:item="c">
                    <div key={c.Id} 
                         class="lux-case-row" 
                         onclick={openDetail} 
                         data-id={c.Id}>
                        
                        <div class="lux-case-id">{c.CaseNumber}</div>
                        
                        <div class="lux-case-subject">{c.Subject}</div>
                        
                        <div class="lux-case-status">
                            <span class={c.statusClass}>{c.Status}</span>
                        </div>
                        
                        <div class="lux-case-arrow">
                            <lightning-icon 
                                icon-name="utility:chevronright" 
                                size="xx-small" 
                                class="gold-icon">
                            </lightning-icon>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <template if:false={hasCases}>
            <div class="lux-empty-state">
                <p>Aucune demande active pour le moment.</p>
            </div>
        </template>
    </div>
</template>
